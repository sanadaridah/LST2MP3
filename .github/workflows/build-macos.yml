name: Build macOS app (developer build)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Apple Silicon application
        run: |
          xcodebuild -project Playlist2MP3.xcodeproj -scheme Playlist2MP3 \
            -configuration Release -sdk macosx -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build build
      - name: Archive app bundle (development build)
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Playlist2MP3.app ../../../../Playlist2MP3-development.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playlist2MP3-macOS-development
          path: Playlist2MP3-development.zip
          if-no-files-found: error