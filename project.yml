name: Playlist2MP3
options:
  bundleIdPrefix: com.playlist2mp3
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: '13.0'
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
    ENABLE_APP_SANDBOX: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Playlist2MP3:
    type: application
    platform: macOS
    deploymentTarget: '13.0'
    sources:
      - path: Playlist2MP3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.playlist2mp3.mac
        INFOPLIST_KEY_CFBundleDisplayName: Playlist2MP3
        GENERATE_INFOPLIST_FILE: YES
        ARCHS: arm64